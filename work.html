<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Same theme system as the homepage (key "fahis-theme"): set it before any CSS loads, so nothing flashes.
      (function () {
        var t = null;
        try { t = localStorage.getItem('fahis-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#000000' : '#ececeb');
      })();
    </script>
    <title>Mohammed Fahis | Work</title>
